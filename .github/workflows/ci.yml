# Автоматична перевірка: збірка + тести на Linux, Windows і macOS.
# Запускається сама після кожного push/pull request у GitHub — без жодних
# локальних інструментів (корисно, коли антивірус блокує cargo на своєму ПК).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:   # можна запустити вручну кнопкою "Run workflow"

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false          # якщо впала одна ОС — решта все одно перевіряються
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Встановити Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Збірка (release)
        run: cargo build --release

      - name: Тести
        run: cargo test --release

      - name: Запуск прикладів
        shell: bash
        run: |
          set -e
          BIN=./target/release/oberih
          $BIN version
          $BIN run examples/22_maps.obh
          $BIN run examples/23_stdlib.obh
          $BIN run examples/24_lambdas_regex.obh
          $BIN run examples/26_bitwise.obh
          $BIN run examples/27_async_tasks.obh

      # Реальний HTTPS (TLS) — локальні тести перевіряють лише http://127.0.0.1,
      # тож без цього кроку помилка налаштування TLS лишилась би непоміченою.
      - name: HTTPS (реальна мережа)
        shell: bash
        run: ./target/release/oberih run examples/28_https_smoke.obh

      # HTTP-сервер: serve + одночасні клієнти + stopServer у одному процесі.
      - name: HTTP-сервер
        shell: bash
        run: ./target/release/oberih run examples/29_http_server.obh

      # Заміри швидкості на всіх трьох ОС (порівнюйте між запусками; розкид 10-20% — норма).
      - name: Бенчмарк
        if: always()
        shell: bash
        run: ./target/release/oberih run bench/bench.obh
